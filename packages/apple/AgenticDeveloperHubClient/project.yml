name: AgenticDeveloperHubClient
options:
  bundleIdPrefix: com.mikefullerton.AgenticDeveloperHubClient
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SDKROOT: macosx
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEFINES_MODULE: YES
    SKIP_INSTALL: YES
    GENERATE_INFOPLIST_FILE: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    PRODUCT_NAME: $(TARGET_NAME)
  configs:
    # Testability is for the Debug test bundle; in Release it only costs
    # optimisation of the generated client.
    Debug:
      ENABLE_TESTABILITY: YES

packages:
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    minVersion: "1.12.0"
    maxVersion: "2.0.0"
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    minVersion: "1.3.0"
    maxVersion: "2.0.0"
  swift-http-types:
    url: https://github.com/apple/swift-http-types
    minVersion: "1.0.0"
    maxVersion: "2.0.0"

targets:
  # One multi-destination target (macOS + iOS) rather than a separate
  # AgenticDeveloperHubClient-iOS twin: both approaches landed concurrently
  # (sync branch vs main) and both emit AgenticDeveloperHubClient.framework
  # for iOS, so they cannot coexist. The multi-destination form is the one
  # iOS consumers (BitbagIOS) actually link. iOS floor 17.0 kept from main's
  # target — the more permissive choice; nothing here needs newer API.
  AgenticDeveloperHubClient:
    type: framework
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperHubClient
        SDKROOT: auto
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      configs:
        # The generated client is about 1,000 operations; unstripped, its local
        # symbols are most of the binary. Strip them in every Release build,
        # not only an archive, and keep the exports consumers link against.
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: non-global
    dependencies:
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
      # Sources (ADHClient+Raw.swift, Client.swift, SessionRefreshMiddleware.swift,
      # AuthenticationMiddleware.swift) import HTTPTypes directly. This was never
      # declared: it worked only by accident, riding along as a transitive/static
      # merge of OpenAPIRuntime's own HTTPTypes dependency. That broke once a
      # sibling project in the same workspace (agentictoolkit's AgenticToolkitHubService)
      # also declared swift-http-types explicitly, which flips the shared SPM
      # package graph's resolution for OpenAPIRuntime/OpenAPIURLSession to dynamic
      # PackageProduct frameworks that no longer carry HTTPTypes along for free —
      # producing an "undefined symbols: HTTPTypes.*" link failure in this target.
      - package: swift-http-types
        product: HTTPTypes

  AgenticDeveloperHubClientTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AgenticDeveloperHubClientTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperHubClient.tests
    dependencies:
      - target: AgenticDeveloperHubClient
        embed: true
        codeSign: true

schemes:
  AgenticDeveloperHubClient:
    build:
      targets:
        AgenticDeveloperHubClient: all
        AgenticDeveloperHubClientTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgenticDeveloperHubClientTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
