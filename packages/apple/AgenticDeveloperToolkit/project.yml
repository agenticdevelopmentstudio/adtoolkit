name: AgenticDeveloperToolkit
options:
  bundleIdPrefix: com.mikefullerton.AgenticDeveloperToolkit
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
    tvOS: "17.0"
    visionOS: "1.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEFINES_MODULE: YES
    SKIP_INSTALL: YES
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    LM_FILTER_WARNINGS: YES
    OTHER_LDFLAGS: "$(inherited) -weak_framework AppIntents"

targets:
  AgenticDeveloperToolkit-macOS:
    type: framework
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkit.lib.macos
        PRODUCT_NAME: AgenticDeveloperToolkit

  AgenticDeveloperToolkitTests-macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AgenticDeveloperToolkit-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkit.tests.macos
        GENERATE_INFOPLIST_FILE: YES

  AgenticDeveloperToolkitUI-macOS:
    type: framework
    platform: macOS
    sources:
      - path: SourcesUI/Shared
        optional: true
      - path: SourcesUI/macOS
      - path: SourcesUI/Resources
        buildPhase: resources
    dependencies:
      - target: AgenticDeveloperToolkit-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkitUI.lib.macos
        PRODUCT_NAME: AgenticDeveloperToolkitUI

  AgenticDeveloperToolkitUITests-macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      # Shared first: the suites that are identical on both platforms live
      # once, in TestsUI/Shared, and compile into both test bundles. Only a
      # genuinely platform-specific test belongs in the per-platform folder.
      - path: TestsUI/Shared
      - path: TestsUI/AgenticDeveloperToolkitUITests
    dependencies:
      - target: AgenticDeveloperToolkitUI-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkitUI.tests.macos
        GENERATE_INFOPLIST_FILE: YES

  AgenticDeveloperToolkitUI-iOS:
    type: framework
    platform: iOS
    sources:
      - path: SourcesUI/Shared
        optional: true
      - path: SourcesUI/iOS
        optional: true
      - path: SourcesUI/Resources
        buildPhase: resources
    dependencies:
      - target: AgenticDeveloperToolkit-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkitUI.lib.ios
        PRODUCT_NAME: AgenticDeveloperToolkitUI
        TARGETED_DEVICE_FAMILY: "1,2"

  AgenticDeveloperToolkitUITests-iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      # See the macOS test bundle above: TestsUI/Shared is compiled into both.
      - path: TestsUI/Shared
      - path: TestsUI/AgenticDeveloperToolkitUITests-iOS
    dependencies:
      - target: AgenticDeveloperToolkitUI-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkitUI.tests.ios
        GENERATE_INFOPLIST_FILE: YES

  AgenticDeveloperToolkit-iOS:
    type: framework
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkit.lib.ios
        PRODUCT_NAME: AgenticDeveloperToolkit
        TARGETED_DEVICE_FAMILY: "1,2"

  AgenticDeveloperToolkit-watchOS:
    type: framework
    platform: watchOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkit.lib.watchos
        PRODUCT_NAME: AgenticDeveloperToolkit

  AgenticDeveloperToolkit-tvOS:
    type: framework
    platform: tvOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkit.lib.tvos
        PRODUCT_NAME: AgenticDeveloperToolkit

  AgenticDeveloperToolkit-visionOS:
    type: framework
    platform: visionOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkit.lib.visionos
        PRODUCT_NAME: AgenticDeveloperToolkit
        TARGETED_DEVICE_FAMILY: "7"

schemes:
  AgenticDeveloperToolkit-macOS:
    build:
      targets:
        AgenticDeveloperToolkit-macOS: all
        AgenticDeveloperToolkitTests-macOS: [test]
    test:
      config: Debug
      targets:
        - AgenticDeveloperToolkitTests-macOS
    run:
      config: Debug
  AgenticDeveloperToolkitUI-macOS:
    build:
      targets:
        AgenticDeveloperToolkitUI-macOS: all
        AgenticDeveloperToolkitUITests-macOS: [test]
    test:
      config: Debug
      targets:
        - AgenticDeveloperToolkitUITests-macOS
    run:
      config: Debug
  AgenticDeveloperToolkitUI-iOS:
    build:
      targets:
        AgenticDeveloperToolkitUI-iOS: all
    run:
      config: Debug
  AgenticDeveloperToolkitUITests-iOS:
    build:
      targets:
        AgenticDeveloperToolkitUI-iOS: all
        AgenticDeveloperToolkitUITests-iOS: [test]
    test:
      config: Debug
      targets:
        - AgenticDeveloperToolkitUITests-iOS
    run:
      config: Debug
  AgenticDeveloperToolkit-iOS:
    build:
      targets:
        AgenticDeveloperToolkit-iOS: all
    run:
      config: Debug
  AgenticDeveloperToolkit-watchOS:
    build:
      targets:
        AgenticDeveloperToolkit-watchOS: all
    run:
      config: Debug
  AgenticDeveloperToolkit-tvOS:
    build:
      targets:
        AgenticDeveloperToolkit-tvOS: all
    run:
      config: Debug
  AgenticDeveloperToolkit-visionOS:
    build:
      targets:
        AgenticDeveloperToolkit-visionOS: all
    run:
      config: Debug
