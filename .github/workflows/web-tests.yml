# ADT is consumed as a submodule by more than one host repo, so its suites run AT
# THE SOURCE on every push and PR — not only inside a consumer's CI at whatever
# pinned SHA that consumer happens to hold.
name: web-tests

on:
  push:
    branches: [main]
    # The filter must cover every root the guards below SCAN, not just the code they
    # were originally written for. It listed `packages/web/**` alone, so a leak or a
    # dangling citation landing in `recipes/`, `docs/`, `websites/` or a root doc
    # changed nothing the filter could see and the guards that police those trees
    # never ran on the commit that broke them. Keep this list and the guards' roots
    # in step: `check_no_private_scope.py` scans packages/web/packages, recipes, docs,
    # websites plus README.md, AGENTS.md and .claude/CLAUDE.md; `check_doc_links.py`
    # scans the whole repo; `check_recipe_scope.py` scans recipes and docs.
    # `check_site_deps.py` scans websites — which nothing else in this job enters:
    # the install/build/test steps below all run inside packages/web, so the demo
    # site's own manifest and imports are checked by that guard and nothing else.
    # `tools/**` is here because a change to a guard must re-run that guard.
    # `cookbook/**` is ATK's spec corpus, which `check_doc_links.py` scans with
    # the rest of the repo.
    paths:
      - "packages/web/**"
      - "recipes/**"
      - "cookbook/**"
      - "docs/**"
      - "websites/**"
      - "tools/**"
      - "README.md"
      - "AGENTS.md"
      - ".claude/CLAUDE.md"
      - ".github/workflows/web-tests.yml"
  pull_request:
    # Deliberately spelled out rather than sharing a YAML anchor with the push
    # trigger: GitHub Actions does not guarantee anchor support in workflow files.
    # The two lists must stay identical — edit both together.
    paths:
      - "packages/web/**"
      - "recipes/**"
      - "cookbook/**"
      - "docs/**"
      - "websites/**"
      - "tools/**"
      - "README.md"
      - "AGENTS.md"
      - ".claude/CLAUDE.md"
      - ".github/workflows/web-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure-Python, no toolchain — run before install so a regression fails in
      # seconds rather than after the whole workspace builds. Self-test first,
      # for each guard: a guard whose failing case has rotted passes vacuously.
      - name: repo guards
        run: |
          python3 packages/web/tools/check_license_fields_test.py
          python3 packages/web/tools/check_license_fields.py
          python3 tools/check_recipe_scope_test.py
          python3 tools/check_recipe_scope.py
          python3 tools/check_recipe_scope.py --root docs
          python3 tools/check_doc_links_test.py
          python3 tools/check_doc_links.py
          python3 tools/check_doc_subpaths_test.py
          python3 tools/check_doc_subpaths.py
          python3 tools/check_site_deps_test.py
          python3 tools/check_site_deps.py
          python3 tools/rewrite_toolkit_scope_test.py
          python3 tools/classify_recipes_test.py
          python3 packages/web/tools/copy_css_orphan_test.py

      # adh's persona-chat keeps a COPY of chat's contract types rather than a dep
      # (the layering in packages/web/packages/adh keeps the persona toolkit out of
      # adh's shipped graph), so nothing but this check notices the two drifting.
      # Run from packages/web because the verifier resolves both files from there.
      - name: chat contract copy is in sync
        working-directory: packages/web
        run: |
          python3 tools/verify_chat_types_copy_test.py
          python3 tools/verify_chat_types_copy.py

      # Eight packages are arriving here from a PRIVATE repo, each carrying the
      # prose its old home wrote about it. The per-package arrival checks scan
      # src/, which is where the imports are — and imports are not where this
      # leaks. It leaks in a README, a CHANGELOG, a comment in a config file:
      # the files nobody greps because they do not compile.
      - name: no private package references
        run: |
          python3 tools/check_no_private_scope_test.py
          python3 tools/check_no_private_scope.py

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: packages/web

      # A fresh checkout has neither `themes`' generated src/theme-data.ts (gitignored,
      # produced by its own `build:data`) nor any package's `dist/`. Most packages
      # resolve straight from `src/` for an in-repo/workspace consumer with no build
      # step — but `model` (arrived with AT's "Model A" contract: package.json's
      # `main`/`exports` point only at `./dist/...`, no source fallback) does not, and
      # `controls` depends on it. Both gaps are invisible in a dev checkout, where a
      # prior `pnpm build` or `./install.sh` run leaves stale artifacts on disk indefinitely
      # — this step is what makes CI actually exercise a clean checkout instead of trusting
      # whatever the last local build left behind.
      - run: pnpm build
        working-directory: packages/web

      # The boundary checks (self-test first) and every package's `tsc`. ATK's CI
      # skipped this because per-package tsc resolves sibling DIST types that a
      # fresh checkout had not built; the `pnpm build` step above is what makes
      # it runnable here.
      - run: pnpm lint
        working-directory: packages/web

      # One command, both halves, because neither alone covers the workspace. The
      # root `vitest run` is configured with `dir: './packages'`, so it DISCOVERS
      # every package's tests including the ones that declare no test script of
      # their own, `chat` among them. `pnpm -r --if-present run test` covers the
      # opposite gap: a package that declares a test script runs under ITS OWN
      # config, which is the config its consumers build against, and which can
      # differ from the root's (extra setup files, a different environment). That
      # only holds because every such package carries a vitest.config.ts — vitest
      # walks up to the root config but keeps cwd as its root, so the root's
      # `dir: './packages'` would resolve to <package>/packages and silently match
      # nothing. A package that declares `test` without its own config runs zero
      # tests and exits 0.
      #
      # The root `test` script chains the two, and it is the command
      # CONTRIBUTING.md tells contributors to run — a public repo whose documented
      # test command is not the one CI runs is telling two different stories about
      # what passing means. CI used to run the recursive half again as its own
      # step; that ran every package-level suite twice.
      - run: pnpm test
        working-directory: packages/web
